# リマインド：10分おきに、記録済みのチケット受付開始日時を見てLINEで知らせる（サイトにはアクセスしない）
name: リマインド

on:
  schedule:
    # 3分, 13分, 23分 … と10分おき（混雑する0分ちょうどを避けています）
    - cron: "3-59/10 * * * *"
  workflow_dispatch:

concurrency:
  group: live-notifier-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: リマインドをLINEに送る
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python remind.py

      - name: 記録ファイルを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add data/
          if git diff --cached --quiet; then
            echo "記録に変更なし"
          else
            git commit -m "リマインドの送信記録を更新"
            git pull --rebase
            git push
          fi
