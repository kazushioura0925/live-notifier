# LINE送信テスト：Secretsが正しく登録できているか確かめるため、テストメッセージを1通送る（手動実行のみ）
name: LINE送信テスト

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: テストメッセージをLINEに送る
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python -c "import line_api; line_api.push_texts(['✅ テスト通知\nライブ情報通知ツールからLINEに届きました。設定は正常です。'])"
